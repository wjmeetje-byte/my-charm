# 저장소 루트에 두는 파일. Netlify가 이걸 읽어 설정을 적용한다.

[build]
  # deploy 폴더를 사이트 루트로 삼는다.
  # (GitHub Upload files로 deploy 폴더째 올리면 저장소에 deploy/ 가 생기므로)
  publish = "deploy"

# 공유 링크는 /r/mystery 같은 경로를 쓴다.
# 주소를 바꾸지 않고(200) index.html 을 그대로 내려준다 — 뒤의 JS가 경로를 읽어 결과를 띄운다.
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

# 이미지는 일주일 캐시 — 재방문·공유 유입에서 트래픽을 아낀다
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML은 캐시하지 않는다 — 카카오 키나 애드핏 키를 고쳤을 때 바로 반영되어야 한다
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
